version: 2.1
jobs:
    deploy:
      docker:
        - image: node:24
      steps:
      - checkout
      - run: npm install
      - run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
      - run: npm publish || true
      - run: npm run deploy
      - run: npm run respawner
    test:
      docker:
        - image: node:24
        - image: mongo:7.0
        - image: redis:latest
      steps:
      - checkout
      - run: npm install
      - run:
          command: npm run test
          no_output_timeout: 2h
workflows:
  test_and_deploy:
    jobs:
      - test
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: master
